[package]
name = "slipstream-reader"
description = "Slipstream's reading mode: EPUB books, full screen and distraction free"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# gtk4-rs 0.11 needs a newer Rust than the compositor does.
rust-version = "1.92"

[dependencies]
gtk4.workspace = true
webkit6 = { version = "0.6", features = ["v2_42"] }
rbook = { version = "0.7", default-features = false, features = ["prelude"] }
serde.workspace = true
serde_json.workspace = true
quick-xml = "0.41"
slipstream-config.workspace = true
